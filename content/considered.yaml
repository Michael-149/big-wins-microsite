# Cases we considered
#
# The long list behind "Social Science Delivers". Built from the 67-row
# candidate sheet (37 rows from SIL's own examples list, 2021 to 2025, and 30
# from the Public Solutions R&D network's proof-points analysis), plus two
# candidates named in the same source documents but missing from the sheet
# (syringe services programs and Chile's college application platform).
# Duplicates were merged, names and researcher credits corrected, and items
# outside social science or without a documented research contribution
# removed. Every kept, merged and dropped row, with reasons and the checks
# behind each researcher credit, is logged in the private ledger
# redesign/factcheck/considered.md.
#
# These are candidates, not vetted claims. Only the eight selected cases have
# been fact-checked in full. Summaries carry no impact figures on purpose.
#
# Fields: name, domain, geography, pathway, researchers (confirmed names only;
# an empty list means no individual researcher was confirmed), summary (one
# neutral sentence), selected (true only for the eight featured cases), slug
# (selected cases only; matches the case page URL), source.
#
# Order: the eight featured cases in their display order, then the rest by name.

- name: "Moving to Opportunity and Creating Moves to Opportunity"
  domain: "Housing and urban policy"
  geography: "United States"
  pathway: "Housing experiments informing voucher redesign"
  researchers: ["Raj Chetty", "Nathaniel Hendren", "Lawrence Katz", "Stefanie DeLuca", "James Rosenbaum"]
  summary: "Studies of families who moved to lower-poverty neighborhoods with housing assistance, from Chicago's Gautreaux program to HUD's Moving to Opportunity experiment, found long-run gains for children who moved when young and informed voucher redesigns such as Creating Moves to Opportunity in Seattle and HUD's Small Area Fair Market Rents."
  selected: true
  slug: "moving-to-opportunity"
  source: "Public Solutions R&D proof points"

